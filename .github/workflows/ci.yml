name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: specs (Ruby ${{ matrix.ruby }}, Active Record ${{ matrix.activerecord }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['4.0']
        activerecord: ['7.2', '8.0', '8.1']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graph_query_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACTIVERECORD_VERSION: ${{ matrix.activerecord }}
      GRAPH_QUERY_DATABASE_URL: postgres://postgres:postgres@localhost/graph_query_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rubocop
      - name: RBS signatures
        run: bundle exec rbs collection install && bundle exec rbs validate
      - run: gem build graph_query.gemspec
