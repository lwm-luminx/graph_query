name: Release

# Publishes GraphQuery::VERSION to RubyGems: push a tag vX.Y.Z on main, or run this workflow by hand on main (it tags
# the commit itself). Publishing uses RubyGems trusted publishing: rubygems.org trusts this workflow, so no API key is
# stored in the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graph_query_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GRAPH_QUERY_DATABASE_URL: postgres://postgres:postgres@localhost/graph_query_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rspec
      - name: Tag the version
        id: tag
        run: |
          version=$(ruby -r ./lib/graph_query/version -e 'print GraphQuery::VERSION')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, gem version $version"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = main || { echo "release from main, not $GITHUB_REF_NAME"; exit 1; }
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "v$version" -m "graph_query $version"
            git push origin "v$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: rubygems/release-gem@v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" pkg/*.gem --title "$TAG" --notes-file <(ruby -e 'print File.read("CHANGELOG.md")[/^## #{ARGV[0].delete_prefix("v")}.*?(?=^## |\z)/m]' "$TAG")
