plugins:
  - rubocop-rspec
  - rubocop-rake

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - rbi/**/*
    - site/**/*

Style/Documentation:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 8

RSpec/ExampleLength:
  Max: 12
  CountAsOne: [array, hash, heredoc, method_call]

RSpec/DescribeClass:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

Layout/LineLength:
  Max: 120

RSpec/MultipleMemoizedHelpers:
  Exclude:
    - spec/**/*

RSpec/LetSetup:
  Exclude:
    - spec/**/*

# The fixture graph's models live in one file.
Style/OneClassPerFile:
  Exclude:
    - spec/support/graph_fixtures.rb

# The compiler and the Cypher parser branch on every shape a step or token can take; splitting them further would
# scatter one SQL statement across files.
Metrics/ClassLength:
  Max: 300
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/ParameterLists:
  Max: 9
Metrics/BlockLength:
  AllowedMethods: [class_methods]
Metrics/MethodLength:
  Max: 25
  Exclude:
    - spec/**/*
    - lib/graph_query/graphql.rb

# Mutation classes are built with graphql-ruby's class DSL inside one Class.new block each.
Metrics/AbcSize:
  Max: 36
  Exclude:
    - lib/graph_query/graphql.rb
